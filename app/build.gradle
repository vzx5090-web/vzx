plugins { id 'com.android.application' }

def disableNativeLuau = providers.gradleProperty('disableNativeLuau')
    .map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'com.studiomobile.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.octane.studio.mobile'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.0.0-mobile-preview'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!disableNativeLuau) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }
}
