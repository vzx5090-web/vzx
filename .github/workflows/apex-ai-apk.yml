name: Build APEX AI Android APK

on:
  push:
    branches: [apex-ai-build]
    paths:
      - 'apex-ai-android/**'
      - '.github/workflows/apex-ai-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-ai-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: |
          cd apex-ai-android
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='apex-ai-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee apex-apk-badging.txt
          grep -q "package: name='com.apexai.mobile'" apex-apk-badging.txt
          sha256sum "$APK" | tee apex-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: APEX-AI-Android-APK
          path: |
            apex-ai-android/app/build/outputs/apk/debug/app-debug.apk
            apex-apk-badging.txt
            apex-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
