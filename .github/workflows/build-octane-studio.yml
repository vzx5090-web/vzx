name: Build Octane Studio Android

on:
  push:
    branches:
      - octane-studio-wine-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build Winlator-based Octane Studio ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Octane integration
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout pinned upstream Winlator Android source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: f8a211ce7fd776de9a2642b45d166016876eaa86
          path: upstream
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply Octane Studio integration
        run: |
          python3 overlay/patch/apply_octane_patch.py
          test -f upstream/app/src/main/java/com/winlator/OctaneStudioFragment.java
          grep -q "com.octane.studio.runtime" upstream/app/build.gradle

      - name: Build ARM64 Android APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and prepare install bundle
        working-directory: upstream
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p ../overlay/dist
          cp "$APK" ../overlay/dist/OctaneStudioAndroid-ARM64.apk
          cp LICENSE ../overlay/dist/WINLATOR-LGPL-2.1.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose ../overlay/dist/OctaneStudioAndroid-ARM64.apk
          printf '%s\n' \
            'App: Octane Studio Android' \
            'Package: com.octane.studio.runtime' \
            'Runtime: Winlator / Wine / Box64' \
            'Architecture: arm64-v8a' \
            'Studio payload: fetched from Octane official endpoint at install time' \
            'Upstream: brunodev85/winlator-app' \
            'Upstream commit: f8a211ce7fd776de9a2642b45d166016876eaa86' \
            > ../overlay/dist/BUILD_INFO.txt
          cd ../overlay/dist
          sha256sum OctaneStudioAndroid-ARM64.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OctaneStudioAndroid-ARM64
          path: overlay/dist/*
          if-no-files-found: error
          retention-days: 30
