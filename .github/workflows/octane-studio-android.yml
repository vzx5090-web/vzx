name: Build Octane Studio Mobile APK

on:
  push:
    branches:
      - octane-studio-mobile-apk
    paths:
      - 'octane-studio-android/**'
      - '.github/workflows/octane-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p octane-studio-android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK archive and Android package
        run: |
          APK="octane-studio-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.octane.mobile'|sdkVersion:'23'"

      - name: Install and launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r octane-studio-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.octane.mobile/.MainActivity
            sleep 5
            adb shell pidof com.octane.mobile

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: octane-studio-mobile-debug-apk
          path: octane-studio-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
