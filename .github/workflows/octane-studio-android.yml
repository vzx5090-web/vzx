name: Build Octane Studio Mobile APK

on:
  push:
    branches:
      - octane-studio-mobile-apk
    paths:
      - 'octane-studio-android/**'
      - '.github/workflows/octane-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android APK
        run: gradle -p octane-studio-android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK structure and package metadata
        run: |
          set -euo pipefail
          APK="octane-studio-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.octane.mobile'" apk-badging.txt
          grep -q "sdkVersion:'23'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: octane-studio-mobile-debug-apk
          path: |
            octane-studio-android/app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
